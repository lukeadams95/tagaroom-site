<div style="background:#fff;color:#111111;font-family:'Archivo',system-ui,sans-serif;line-height:1.5">
<dc-import name="Header" cart-count="{{ cartCount }}" hint-size="100%,82px"></dc-import>


<section style="position:relative;background:#22344A;color:#fff;overflow:hidden">
  <div style="position:absolute;inset:0;background:url('assets/hero.webp') center/cover no-repeat"></div>
  <div style="position:absolute;inset:0;background:rgba(10,10,10,.68)"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(40px,6vw,80px) 24px;display:flex;flex-direction:column;align-items:center;text-align:center">
    <div style="display:flex;flex-direction:column;align-items:center;max-width:860px">
      <span style="background:#0169B8;color:#fff;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:8px 20px;border-radius:30px;margin-bottom:24px">{{ eyebrow }}</span>
      <h1 style="text-transform:uppercase;font-family:'Archivo',sans-serif;font-style:italic;font-weight:900;font-size:clamp(34px,5.2vw,62px);line-height:1;margin:0 0 18px;letter-spacing:-.01em">{{ title }}</h1>
      <p style="font-size:clamp(17px,2vw,21px);max-width:620px;margin:0 0 28px;color:#E8EEF4">{{ tagline }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center">
        <a href="#store" style="background:#0169B8;color:#fff;font-weight:700;padding:16px 30px;border-radius:10px;font-size:17px;border:2px solid #0169B8;letter-spacing:.02em" style-hover="background:#fff;color:#0169B8;border-color:#fff">Shop Now</a>
        <a href="Do-It-Yourself%20Families.dc.html" style="border:2px solid #fff;color:#fff;font-weight:700;padding:16px 30px;border-radius:10px;font-size:17px;letter-spacing:.02em" style-hover="background:#fff;color:#111111">Buy for My Home →</a>
      </div>
    </div>
    
  </div>
  <div style="display:flex;height:5px;position:relative"><i style="flex:1;background:#FEFA1F"></i><i style="flex:1;background:#FC811C"></i><i style="flex:1;background:#F91055"></i><i style="flex:1;background:#DA019F"></i><i style="flex:1;background:#724DB5"></i><i style="flex:1;background:#01A0D6"></i><i style="flex:1;background:#40D13D"></i><i style="flex:1;background:#DEF306"></i></div>
</section>

<main id="store" style="max-width:1240px;margin:0 auto;padding:clamp(40px,6vw,72px) 24px clamp(56px,8vw,96px)">
  <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;margin:0 auto 32px;max-width:720px"><label style="display:flex;align-items:center;gap:12px;flex:1 1 320px;background:#fff;border:2px solid #D5DCE5;border-radius:12px;padding:0 18px;height:54px" style-focus="border-color:#0169B8">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7B8D" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input type="search" value="{{ q }}" onInput="{{ onQ }}" onKeyDown="{{ onSearchKey }}" placeholder="Search products and categories" aria-label="Search products" style="flex:1;border:0;outline:0;background:none;font-family:'Archivo',sans-serif;font-size:16px;color:#111111;min-width:0">
  </label>
  <a href="#!/~/cart" onClick="{{ openCart }}" aria-label="View cart" style="display:flex;align-items:center;gap:10px;height:54px;padding:0 22px;background:#0169B8;color:#fff;font-weight:700;border-radius:12px;font-size:16px" style-hover="background:#014F8A;color:#fff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h10L20 7H6"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle></svg>Cart<b style="background:#fff;color:#0169B8;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px">{{ cartCount }}</b></a></div>
  <div id="my-store-1805034"></div>
</main>
<sc-if value="{{ hasFeatured }}" hint-placeholder-val="{{ false }}">
<div style="background:#F5F7FA;padding-bottom:clamp(56px,8vw,96px)"><section style="max-width:1240px;margin:0 auto;padding:clamp(56px,8vw,96px) 24px 0;display:flex;flex-direction:column;gap:24px">
  <h2 style="text-align:center;text-transform:uppercase;font-family:'Archivo',sans-serif;font-style:italic;font-weight:900;font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em">Featured Products</h2>
  <sc-for list="{{ featured }}" as="f" hint-placeholder-count="1">
  <div style="background:#fff;border:1px solid #E3E8EE;border-radius:24px;padding:clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,56px);align-items:center">
    <a href="{{ f.href }}" onClick="{{ f.open }}" role="img" aria-label="{{ f.title }}" style="display:block;aspect-ratio:1/1;border-radius:18px;background:#F9F9F9 center/contain no-repeat;background-image:url({{ f.img }})"></a>
    <div>
      <span style="display:inline-block;background:#0169B8;color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:20px;margin-bottom:16px">Featured</span>
      <h2 style="text-transform:uppercase;font-family:'Archivo',sans-serif;font-style:italic;font-weight:900;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0 0 12px;letter-spacing:-.01em"><a href="{{ f.href }}" onClick="{{ f.open }}" style="color:inherit" style-hover="color:#0169B8">{{ f.title }}</a></h2>
      <div style="font-family:'Archivo',sans-serif;font-style:italic;font-weight:900;font-size:38px;color:#0169B8;margin-bottom:24px;letter-spacing:-.01em">{{ f.price }}</div>
      <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
        <div style="display:flex;align-items:center;border:2px solid #C9D2DD;border-radius:10px;background:#fff">
          <button onClick="{{ f.down }}" aria-label="Decrease" style="width:44px;height:48px;border:0;background:none;font-size:22px;cursor:pointer;color:#111111">−</button>
          <span style="min-width:36px;text-align:center;font-weight:700;font-size:18px">{{ f.qty }}</span>
          <button onClick="{{ f.up }}" aria-label="Increase" style="width:44px;height:48px;border:0;background:none;font-size:22px;cursor:pointer;color:#111111">+</button>
        </div>
        <button onClick="{{ f.add }}" style="background:#0169B8;color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:17px;padding:0 32px;height:52px;border:0;border-radius:10px;cursor:pointer" style-hover="background:#014F8A;color:#fff">Add to Cart</button>
      </div>
    </div>
  </div>
  </sc-for>
</section></div>
</sc-if>
