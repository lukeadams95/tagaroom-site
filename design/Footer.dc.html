<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;1,900&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Archivo',system-ui,sans-serif}*{box-sizing:border-box}a{color:#0169B8;text-decoration:none}a:hover{color:#014F8A}</style>
</helmet>
<footer style="background:#111111;color:#C9D4E0">
  <div style="display:flex;height:5px"><i style="flex:1;background:#FEFA1F"></i><i style="flex:1;background:#FC811C"></i><i style="flex:1;background:#F91055"></i><i style="flex:1;background:#DA019F"></i><i style="flex:1;background:#724DB5"></i><i style="flex:1;background:#01A0D6"></i><i style="flex:1;background:#40D13D"></i><i style="flex:1;background:#DEF306"></i></div>
  <div style="max-width:1240px;margin:0 auto;padding:56px 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:40px">
    <div>
      <a href="#" aria-label="TAG-A-ROOM home" style="display:block;width:206px;height:50px;overflow:hidden;border-radius:6px"><img src="uploads/logo-1790711738779-iq0a.webp" alt="TAG-A-ROOM" style="display: block; width: 206px; height: 79px; margin-top: -15px"></a>
      <p style="font-size:15px;margin:12px 0 6px;max-width:280px">Move and organization made simple.</p>
      <p style="font-size:14px;margin:0 0 18px;max-width:280px">Hours: Monday–Friday, 9:00 am – 4:00 pm Central Time</p>
      <div style="display:flex;gap:12px">
        <a href="#" aria-label="Instagram" style="width:38px;height:38px;border-radius:50%;border:1px solid #3A4A5E;color:#fff;display:flex;align-items:center;justify-content:center" style-hover="background:#014F8A;color:#fff"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle></svg></a>
        <a href="#" aria-label="Facebook" style="width:38px;height:38px;border-radius:50%;border:1px solid #3A4A5E;color:#fff;display:flex;align-items:center;justify-content:center" style-hover="background:#014F8A;color:#fff"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"></path></svg></a>
      </div>
      <img src="assets/payments.png" alt="Accepted payments: Mastercard, Visa, Discover, American Express, PayPal" style="display:block;width:100%;max-width:300px;height:auto;margin-top:18px;border-radius:6px"/>
    </div>
    <div>
      <h4 style="font-family:'Archivo',sans-serif;font-style:italic;font-size:20px;color:#fff;margin:0 0 14px;letter-spacing:.04em;text-transform:uppercase;font-weight:900">Shop</h4>
      <div style="display:flex;flex-direction:column;gap:9px;font-size:15px"><sc-for list="{{ shopLinks }}" as="n" hint-placeholder-count="8"><a href="{{ n.href }}" style="color:#C9D4E0" style-hover="color:#014F8A">{{ n.t }}</a></sc-for></div>
    </div>
    <div>
      <h4 style="font-family:'Archivo',sans-serif;font-style:italic;font-size:20px;color:#fff;margin:0 0 14px;letter-spacing:.04em;text-transform:uppercase;font-weight:900">Industries</h4>
      <div style="display:flex;flex-direction:column;gap:9px;font-size:15px"><sc-for list="{{ audLinks }}" as="n" hint-placeholder-count="7"><a href="{{ n.href }}" style="color:#C9D4E0" style-hover="color:#014F8A">{{ n.t }}</a></sc-for></div>
    </div>
    <div>
      <h4 style="font-family:'Archivo',sans-serif;font-style:italic;font-size:20px;color:#fff;margin:0 0 14px;letter-spacing:.04em;text-transform:uppercase;font-weight:900">Company</h4>
      <div style="display:flex;flex-direction:column;gap:9px;font-size:15px"><sc-for list="{{ company }}" as="n" hint-placeholder-count="5"><a href="#" style="color:#C9D4E0" style-hover="color:#014F8A">{{ n }}</a></sc-for></div>
      <h4 style="font-family:'Archivo',sans-serif;font-style:italic;font-size:20px;color:#fff;margin:28px 0 14px;letter-spacing:.04em;text-transform:uppercase;font-weight:900">Policies</h4>
      <div style="display:flex;flex-direction:column;gap:9px;font-size:15px"><sc-for list="{{ policies }}" as="n" hint-placeholder-count="3"><a href="#" style="color:#C9D4E0" style-hover="color:#014F8A">{{ n }}</a></sc-for></div>
    </div>
  </div>
  <div style="border-top:1px solid #2A3A4E">
    <div style="max-width:1240px;margin:0 auto;padding:18px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:14px"><span>© 2026 TAG-A-ROOM®. All rights reserved.</span><span>Made in the USA</span></div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const FM = {'all':'All%20Products.dc.html','moving-label-systems':'Moving%20Label%20Systems.dc.html','moving-packing-labels':'Moving%20and%20Packing%20Labels.dc.html','box-content-labels':'Box%20Content%20Labels.dc.html','marketing-gifts':'Marketing%20Gifts.dc.html','office-labels':'Office%20Labels%20and%20Supplies.dc.html','alert-labels':'Alert%20Labels.dc.html','shipping-labels':'Shipping%20Labels.dc.html','color-coding-labels':'Color%20Coding%20Labels.dc.html','professional-movers':'Professional%20Movers.dc.html','realtors':'Realtors.dc.html','mortgage-companies':'Mortgage%20Companies.dc.html','restoration-companies':'Restoration%20Companies.dc.html','move-managers':'Move%20Managers.dc.html','apartments':'Apartments%20and%20Property%20Managers.dc.html','diy-families':'Do-It-Yourself%20Families.dc.html'};
    const SL = ["all","moving-label-systems","moving-packing-labels","box-content-labels","marketing-gifts","office-labels","alert-labels","shipping-labels","color-coding-labels","professional-movers","realtors","mortgage-companies","restoration-companies","move-managers","apartments","diy-families"];
    const cat = ['Moving Label Systems', 'Moving & Packing Labels', 'Box Content Labels', 'Marketing Gifts', 'Office Labels', 'Alert Labels', 'Shipping Labels', 'Color Coding Labels'];
    const aud = ['Professional Movers', 'Realtors', 'Mortgage Companies', 'Restoration Companies', 'Move Managers', 'Apartments/Property Management', 'DIY Movers'];
    return {
      shopLinks: cat.map((t, i) => ({ t, href: FM[SL[1 + i]] })),
      audLinks: aud.map((t, i) => ({ t, href: FM[SL[9 + i]] })),
      company: ['About', 'Blog', 'Gallery', 'Templates', 'Contact'],
      policies: ['Shipping', 'Returns', 'General']
    };
  }
}
</script>
</body>
</html>
